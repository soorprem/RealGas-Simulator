<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealGas Simulator</title>
<meta name="description" content="Peng–Robinson PVT, enthalpy, entropy and fugacity simulator. Runs Python in your browser.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css">
<style>html,body,#root{margin:0;min-height:100%;background:#f6f8fb}#boot{font:16px system-ui;padding:32px;color:#173047;max-width:700px;margin:auto}#boot small{display:block;margin-top:12px;line-height:1.6}</style></head>
<body><div id="boot"><strong>RealGas Simulator</strong><p>Loading the Python calculation environment…</p><small>The first visit downloads the scientific packages. Please allow up to two minutes. Calculations run in your browser; no installation is needed. For an offline demonstration, use the supplied Streamlit project.</small></div><div id="root"></div>
<script type="module">
try {
 const {mount}=await import('https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js');
 const response=await fetch('./files.json');if(!response.ok)throw Error('Could not load the application files.');
 const files=await response.json();
 window.realgas=mount({entrypoint:'app.py',files,requirements:['numpy','pandas','plotly==6.3.0','reportlab==4.4.3'],streamlitConfig:{'theme.primaryColor':'#087f8c','theme.backgroundColor':'#f6f8fb','theme.secondaryBackgroundColor':'#eaf0f5','theme.textColor':'#173047'}},document.getElementById('root'));
 document.getElementById('boot').remove();
} catch(error){document.getElementById('boot').textContent='Unable to load browser Python: '+error.message+'. Use the downloadable Streamlit project.';}
</script></body></html>
