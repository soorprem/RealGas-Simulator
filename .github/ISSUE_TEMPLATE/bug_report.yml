name: Bug report
description: Report an incorrect calculation or interface problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and input values
      description: Include component, temperature, pressure, units, root rule and reference state. For custom data, include critical properties and Cp coefficients.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Independent reference
      description: For a numerical discrepancy, provide the expected value, source and reference convention.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python/Streamlit version or browser, operating system, local/browser build and error text. Remove credentials or personal details from logs.
    validations:
      required: true

